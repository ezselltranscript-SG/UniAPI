services:
  - type: web
    name: uniapi
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: $PORT
      - key: API_RELOAD
        value: false
      - key: CORS_ORIGINS
        value: "*"
      # uvicorn reads this for its worker count (default 1). Each worker is a
      # separate process with its own memory; raise to 2 only if the plan has
      # the RAM (the heavy endpoints already run off the event loop).
      - key: WEB_CONCURRENCY
        value: "1"
      # /pdf-to-image conversions allowed at once per process; the rest queue.
      # Each one holds ~100 MB, and a full n8n batch at once got the process
      # OOM-killed. Raise only if the plan has the RAM (and the CPU to use it).
      - key: PDF_TO_IMAGE_MAX_CONCURRENCY
        value: "2"
    autoDeploy: true
